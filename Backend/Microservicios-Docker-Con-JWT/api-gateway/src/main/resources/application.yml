server:
  port: 9090

spring:
  main:
    web-application-type: reactive
  security:
    oauth2:
      resourceserver:
        jwt:
          secret-key: ${APP_JWT_SECRET:Corpaliv_JWT_Secret_Change_Before_Production_2026}
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: ${AUTH_URL:http://localhost:9094}
          predicates:
            - Path=/auth/**
        - id: contenidos-service
          uri: ${CONTENIDOS_URL:http://localhost:9091}
          predicates:
            - Path=/contenidos/**
        - id: vinculacion-service
          uri: ${VINCULACION_URL:http://localhost:9092}
          predicates:
            - Path=/vinculacion/**

management:
  endpoints:
    web:
      exposure:
        include: health,info
